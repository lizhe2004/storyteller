[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "storyteller"
version = "0.1.0"
description = "Audio story generator"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "pydub>=0.25",
    "python-dotenv>=1.0",
    "partialjson>=1.2.0",
    "websocket-client>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "itsdangerous>=2.1",
    "httpx>=0.27",
]
# DashScope SDK is only needed for Aliyun *realtime* streaming TTS in the web
# player; Aliyun HTTP (non-realtime) TTS and the CLI work without it.
aliyun = [
    "dashscope>=1.20",
]

[project.scripts]
storyteller = "storyteller.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"storyteller.providers.volcengine" = ["voices.json"]
"storyteller.providers.aliyun" = ["voices.json"]
"storyteller.web" = [
    "static/*.html",
    "static/*.js",
    "static/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
